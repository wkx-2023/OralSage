<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>门诊统计 - 口腔多模块工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/stats-page.css?v=20260429-compact-gradient">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <nav id="module-nav" class="module-nav"></nav>
    </aside>

    <section class="main-pane">
      <header class="topbar">
        <div>
          <h1 id="page-title" class="page-title"></h1>
          <p id="page-subtitle" class="page-subtitle"></p>
        </div>
        
      </header>

      <main class="workspace stats-workspace">
        <section class="stats-search-zone">
          <div class="search-line">
            <input id="stats-query" class="search-input" placeholder="请输入统计请求，例如：2025年阻生牙治疗方式分布">
            <button type="button" id="stats-run" class="btn strong">执行统计</button>
          </div>
        </section>

        <section class="stats-visual-zone">
          <div id="stats-chart-grid" class="stats-chart-grid"></div>
        </section>
      </main>
    </section>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/stats.js?v=20260429-compact-gradient"></script>
</body>
</html>
