<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Pin &amp; Paper 预览 — OralSage 中文模板</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ======== IDENTICAL to upstream template.html CSS ======== */
:root {
  --paper:    #EFE56A;
  --paper-2:  #F5ECA0;
  --paper-3:  #E8D85A;
  --cream:    #F8F1D6;
  --kraft:    #C9A66B;
  --ink:      #1F3A8A;
  --ink-soft: #2D4FB8;
  --ink-line: #3457C4;
  --black:    #0E1430;
  --red:      #C2342B;
  --olive:    #6B7A2E;
  --orange:   #D8702A;
}

html, body { margin:0; padding:0; background:#1a1a1a; }
body { font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
deck-stage { background: #1a1a1a; }

section.slide {
  background:
    radial-gradient(120% 90% at 20% 10%, rgba(255,255,255,.18), transparent 60%),
    radial-gradient(140% 100% at 80% 95%, rgba(0,0,0,.05), transparent 55%),
    var(--paper);
  color: var(--ink);
  overflow: hidden;
  position: relative;
}
section.slide.cream { background:
    radial-gradient(120% 90% at 20% 10%, rgba(255,255,255,.5), transparent 60%),
    var(--cream); }
section.slide.deep  { background:
    radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.18), transparent 60%),
    var(--paper-3); }
section.slide.ink {
  background:
    radial-gradient(120% 90% at 20% 10%, rgba(255,255,255,.06), transparent 60%),
    var(--ink);
  color: var(--paper);
}

/* paper grain */
section.slide::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: .35;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.2  0 0 0 .25 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
section.slide.ink::before { opacity: .25; mix-blend-mode: screen; }

/* chrome */
.top {
  position: absolute; top: 44px; left: 64px; right: 64px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: "DM Mono", ui-monospace, monospace;
  font-weight: 500; font-size: 18px;
  letter-spacing: .12em; text-transform: uppercase; line-height: 1;
}
.top .lockup { display: flex; align-items: center; gap: 14px; }
.top .lockup svg { width: 32px; height: 16px; }
.top .meta { display: flex; gap: 36px; opacity: .7; }
section.slide.ink .top { color: var(--paper); }

.footer {
  position: absolute; left: 64px; right: 64px; bottom: 36px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: "DM Mono", ui-monospace, monospace;
  font-weight: 500; font-size: 15px;
  letter-spacing: .14em; text-transform: uppercase;
  opacity: .65;
}
section.slide.ink .footer { color: var(--paper); opacity: .75; }

.scribble {
  font-family: "Caveat", cursive;
  color: var(--ink);
  line-height: 1.05;
}

.stamp {
  display: inline-block;
  border: 3px solid var(--red);
  color: var(--red);
  padding: 6px 16px;
  font-family: "DM Mono", monospace;
  font-weight: 500;
  font-size: 16px;
  letter-spacing: .18em;
  text-transform: uppercase;
  transform: rotate(-4deg);
}

/* ============ 01 COVER ============ */
.s-cover { padding: 0; }
.s-cover .stage {
  position: absolute; inset: 0;
  padding: 110px 64px 80px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 24px;
  z-index: 2;
}
.s-cover .super {
  font-family: "DM Mono", monospace;
  font-weight: 500;
  font-size: 18px; letter-spacing: .22em; text-transform: uppercase;
  opacity: .85;
}
.s-cover h1 {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  font-size: 196px;
  line-height: 1.08;
  letter-spacing: -.04em;
  color: var(--ink);
  margin: 0;
  align-self: center;
  max-width: 14ch;
}
.s-cover .pin-1 {
  position: absolute; top: 130px; right: 80px;
  width: 420px; transform: rotate(-8deg);
  color: var(--ink); z-index: 1;
}
.s-cover .pin-2 {
  position: absolute; bottom: 200px; right: 140px;
  width: 360px; transform: rotate(14deg);
  color: var(--ink); z-index: 1;
}
.s-cover .handwritten {
  position: absolute;
  right: 80px; bottom: 360px;
  font-family: "Caveat", cursive;
  font-size: 38px;
  line-height: 1.1;
  color: var(--ink);
  transform: rotate(-3deg);
  transform-origin: right bottom;
  text-align: right;
  z-index: 3;
}
.s-cover .handwritten .underline {
  border-bottom: 2px solid var(--ink);
}
.s-cover .row {
  display: flex; align-items: end; justify-content: space-between;
  gap: 32px;
}
.s-cover .row .who {
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .18em; text-transform: uppercase;
}
.s-cover .row .who small {
  display: block; opacity: .7; margin-top: 6px; letter-spacing: .14em;
}
.s-cover .row .date {
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .18em; text-transform: uppercase;
  text-align: right;
}

/* ============ 02 AGENDA ============ */
.s-agenda h2 {
  position: absolute; left: 64px; top: 110px;
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 96px; line-height: 1.05; letter-spacing: -.03em;
  margin: 0; color: var(--ink);
}
.s-agenda .list {
  position: absolute; left: 64px; right: 64px; top: 340px; bottom: 100px;
  display: flex; flex-direction: column;
}
.s-agenda .row-item {
  display: grid;
  grid-template-columns: 90px 1fr 140px 240px;
  align-items: center;
  gap: 32px;
  padding: 22px 0;
  border-bottom: 1.5px dashed rgba(31,58,138,.45);
}
.s-agenda .row-item:last-child { border-bottom: 0; }
.s-agenda .row-item .num {
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 22px; letter-spacing: .14em;
}
.s-agenda .row-item .lab {
  font-family: "Space Grotesk", sans-serif; font-weight: 600;
  font-size: 44px; letter-spacing: -.02em; line-height: 1;
}
.s-agenda .row-item .pin {
  width: 120px; height: 28px; color: var(--ink);
  transform: rotate(-3deg);
}
.s-agenda .row-item .meta {
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
  opacity: .7; text-align: right;
}

/* ============ 03 NOTECARDS ============ */
.s-notes .head { position: absolute; left: 64px; right: 64px; top: 110px; }
.s-notes h2 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 84px; line-height: 1.05; letter-spacing: -.03em; margin: 0;
}
.s-notes .sub {
  margin-top: 14px;
  font-size: 22px; line-height: 1.45; max-width: 60ch; opacity: .85;
}
.s-notes .grid {
  position: absolute; left: 64px; right: 64px; top: 400px; bottom: 100px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
}
.s-notes .grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.s-notes .grid.cols4 { grid-template-columns: repeat(2, 1fr); }
/* Fixed 2-up variant: more vertical space for spacious double-card layout */
.s-notes .grid.notes-2up {
  top: 330px;
  grid-template-columns: repeat(2, 1fr);
}
/* Fixed 4-up variant: 2x2 grid, slightly more headroom */
.s-notes .grid.notes-4up {
  top: 365px;
  grid-template-columns: repeat(2, 1fr);
}
.s-notes .card {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 28px 22px 22px;
  display: flex; flex-direction: column;
  position: relative;
  box-shadow: 5px 6px 0 0 var(--ink);
}
.s-notes .card.alt  { background: var(--paper-2); }
.s-notes .card.alt2 { background: #FBE6A4; transform: rotate(.6deg); }
.s-notes .card .pin {
  position: absolute; top: -16px; left: 28px;
  width: 110px; height: 32px;
  color: var(--ink);
  transform: rotate(-10deg);
}
.s-notes .card .num {
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .2em; text-transform: uppercase;
  opacity: .65; margin-top: 8px;
}
.s-notes .card h3 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 32px; line-height: 1.05; letter-spacing: -.02em;
  margin: 10px 0 12px;
}
.s-notes .card p { font-size: 17px; line-height: 1.4; margin: 0; }
.s-notes .card .scribble {
  margin-top: auto; padding-top: 12px;
  font-size: 26px; line-height: 1.05;
  transform: rotate(-1.5deg);
  transform-origin: left;
}
.s-notes .card .scribble .underline { border-bottom: 2px solid var(--ink); }

/* ============ 04 SECTION DIVIDER (ink) ============ */
.s-sec { padding: 0; }
.s-sec .marker {
  position: absolute; left: 64px; top: 110px;
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--paper); opacity: .8;
}
.s-sec .label {
  position: absolute; right: 64px; top: 110px;
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--paper); opacity: .8; text-align: right;
}
.s-sec h2 {
  position: absolute;
  left: 64px; right: 480px; bottom: 180px;
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 168px; line-height: 1.05; letter-spacing: -.04em;
  color: var(--paper); margin: 0;
}
.s-sec .pin-big {
  position: absolute; right: 64px; top: 280px;
  width: 640px; color: var(--paper);
  transform: rotate(-14deg); opacity: .85;
}
.s-sec .scribble {
  position: absolute; left: 64px; bottom: 90px;
  font-size: 36px; color: var(--paper); opacity: .9;
  transform: rotate(-2deg);
}

/* ============ 05 NOTICE (text-dense) ============ */
.s-notice .head {
  position: absolute; left: 64px; right: 64px; top: 110px;
  display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: start;
}
.s-notice .head .pre {
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .2em; text-transform: uppercase;
  border-right: 2px solid var(--ink);
  padding-right: 28px; padding-top: 14px;
  white-space: nowrap;
}
.s-notice .head h2 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 50px; line-height: 1.05; letter-spacing: -.02em; margin: 0;
}
.s-notice .grid {
  position: absolute; left: 64px; right: 64px; top: 320px; bottom: 90px;
  display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 28px;
}
.s-notice .grid.cols2 { grid-template-columns: 1.2fr 1fr; }
.s-notice .col {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 28px 28px 24px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 4px 5px 0 0 var(--ink);
}
.s-notice .col.b { background: var(--paper-2); }
.s-notice .col h3 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 24px; letter-spacing: -.01em;
  border-bottom: 1.5px solid var(--ink); padding-bottom: 10px; margin: 0;
}
.s-notice .col .meta {
  font-family: "Caveat", cursive; font-weight: 600;
  font-size: 28px; line-height: 1.05;
  opacity: .8;
}
.s-notice .col p { font-size: 17px; line-height: 1.45; margin: 0; }
.s-notice .col ul { margin: 0; padding-left: 20px; font-size: 19px; line-height: 1.45; }
.s-notice .col ul li { margin-bottom: 8px; }
.s-notice .col .src {
  margin-top: auto;
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
  border-top: 1px dashed rgba(31,58,138,.45); padding-top: 10px; opacity: .75;
}

/* ============ 06 CHART ============ */
.s-chart { padding: 0; }
.s-chart .left {
  position: absolute; left: 64px; top: 200px; bottom: 110px; width: 600px;
  display: flex; flex-direction: column; gap: 24px;
}
.s-chart .left h2 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 110px; line-height: 1.05; letter-spacing: -.035em; margin: 0;
  color: var(--paper);
}
.s-chart .left p { font-size: 21px; line-height: 1.5; color: var(--paper); opacity: .85; max-width: 36ch; }
.s-chart .left .legend { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.s-chart .left .legend .li {
  display: flex; align-items: center; gap: 14px;
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--paper);
}
.s-chart .left .legend .li i { width: 32px; height: 4px; }
.s-chart .right {
  position: absolute; right: 64px; top: 180px; bottom: 110px; left: 720px;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 28px 32px 24px 76px;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 6px 7px 0 0 rgba(239,229,106,.25);
}
.s-chart .right .yhead {
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 14px; letter-spacing: .16em; text-transform: uppercase;
  margin-bottom: 8px; opacity: .7;
}
.s-chart .plot { flex: 1; min-height: 0; position: relative;
  border-left: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
.s-chart .plot .gline { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(31,58,138,.25); }
.s-chart .plot .yticks {
  position: absolute; left: -48px; top: 0; bottom: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  font-family: "DM Mono", monospace; font-weight: 500; font-size: 14px;
}
.s-chart .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.s-chart .right .xticks {
  display: flex; justify-content: space-between; padding-top: 8px;
  font-family: "DM Mono", monospace; font-weight: 500; font-size: 14px; letter-spacing: .1em;
}
.s-chart .pin-deco {
  position: absolute; top: 110px; right: 60px;
  width: 240px; color: var(--paper);
  transform: rotate(20deg); opacity: .35;
}

/* ============ 07 PROCESS (pinned cards) ============ */
.s-process .head {
  position: absolute; left: 64px; right: 64px; top: 110px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 40px;
}
.s-process .head h2 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 88px; line-height: 1.05; letter-spacing: -.035em; margin: 0;
}
.s-process .head .sub {
  font-family: "Space Grotesk", sans-serif;
  font-size: 19px; line-height: 1.5; max-width: 36ch; opacity: .85; margin-top: 12px;
}
.s-process .flow {
  position: absolute; left: 64px; right: 64px; top: 460px; bottom: 200px;
  display: grid; gap: 22px;
}
.s-process .flow.cols5 { grid-template-columns: repeat(5, 1fr); }
.s-process .flow.cols4 { grid-template-columns: repeat(4, 1fr); }
.s-process .flow.cols3 { grid-template-columns: repeat(3, 1fr); }
.s-process .node {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 32px 22px 22px;
  display: flex; flex-direction: column; gap: 8px; position: relative;
  box-shadow: 4px 5px 0 0 var(--ink);
}
.s-process .node.alt  { background: var(--paper-2); }
.s-process .node.alt2 { background: #FBE6A4; }
.s-process .node .pin {
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-6deg);
  width: 96px; height: 28px; color: var(--ink);
}
.s-process .node .n {
  font-family: "Caveat", cursive; font-weight: 700;
  font-size: 70px; line-height: .9; color: var(--ink);
}
.s-process .node h3 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 28px; line-height: 1.05; letter-spacing: -.015em; margin: 0;
}
.s-process .node p { font-size: 18px; line-height: 1.4; margin: 0; }
.s-process .node .arr {
  position: absolute; right: -16px; top: 44%;
  width: 28px; height: 28px; z-index: 2; color: var(--ink);
}
.s-process .node:last-child .arr { display: none; }
.s-process .timeline {
  position: absolute; left: 64px; right: 64px; bottom: 110px; height: 48px;
  background: transparent;
  border-top: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
  font-family: "DM Mono", monospace; font-weight: 500;
  font-size: 16px; letter-spacing: .12em; text-transform: uppercase;
}

/* ============ 08 LEDGER (comparison) ============ */
.s-matrix .head {
  position: absolute; left: 64px; right: 64px; top: 110px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 40px;
}
.s-matrix .head h2 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 76px; line-height: 1.05; letter-spacing: -.035em; margin: 0;
}
.s-matrix .head .sub {
  font-size: 19px; line-height: 1.5; max-width: 36ch; opacity: .85; margin-top: 12px;
}
.s-matrix .table {
  position: absolute; left: 64px; right: 64px; top: 440px; bottom: 110px;
  background: var(--cream);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  display: grid;
  grid-auto-rows: 1fr; overflow: hidden;
  box-shadow: 5px 6px 0 0 var(--ink);
}
.s-matrix .cell {
  padding: 18px 22px; display: flex; align-items: center;
  font-size: 21px; line-height: 1.35;
  border-bottom: 1.5px solid rgba(31,58,138,.5);
  border-right: 1.5px solid rgba(31,58,138,.5);
}
.s-matrix .cell.last-row { border-bottom: 0; }
.s-matrix .cell.head-row {
  background: var(--ink); color: var(--paper);
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 22px; letter-spacing: -.005em;
  border-right-color: rgba(239,229,106,.3);
}
.s-matrix .cell.row-label {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 24px; letter-spacing: -.01em;
}
.s-matrix .pill {
  display: inline-block;
  font-family: "Caveat", cursive; font-weight: 600;
  font-size: 28px; line-height: 1;
  padding: 4px 14px; border-radius: 999px;
  border: 1.5px solid var(--ink);
}
.s-matrix .pill.yes  { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.s-matrix .pill.part { background: var(--paper-2); color: var(--ink); }
.s-matrix .pill.no   {
  background: transparent; color: var(--red); border-color: var(--red);
  font-family: "DM Mono", monospace; font-weight: 500; font-size: 16px;
  letter-spacing: .14em; text-transform: uppercase;
}
.s-matrix .pill.note { background: transparent; }

/* ============ 09 STATS ============ */
.s-stats .head {
  position: absolute; left: 64px; right: 64px; top: 110px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 40px;
}
.s-stats .head h2 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 92px; line-height: 1.05; letter-spacing: -.035em; margin: 0;
}
.s-stats .head .sub {
  font-size: 19px; line-height: 1.5; max-width: 36ch; opacity: .85; margin-top: 12px;
}
.s-stats .grid {
  position: absolute; left: 64px; right: 64px; top: 460px; bottom: 110px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
}
.s-stats .grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.s-stats .stat {
  background: var(--cream);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 32px 30px;
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
  box-shadow: 5px 6px 0 0 var(--ink);
}
.s-stats .stat.alt  { background: var(--paper-2); }
.s-stats .stat.alt2 { background: #FBE6A4; }
.s-stats .stat .pin {
  position: absolute; top: -14px; left: 32px;
  width: 110px; height: 32px;
  color: var(--ink);
  transform: rotate(-8deg);
}
.s-stats .stat .big {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;
  font-size: 168px; line-height: .85; letter-spacing: -.04em;
  margin-top: 16px;
}
.s-stats .stat .big small {
  font-family: "Caveat", cursive; font-weight: 700;
  font-size: 60px; vertical-align: top; margin-left: 6px;
}
.s-stats .stat h3 {
  font-family: "Space Grotesk", sans-serif; font-weight: 700;

<script>
/**
 * Pin & Paper Preview Renderer
 * =============================
 * Renders pin-and-paper-plan.v1.json fixture into Pin & Paper styled slides.
 * CSS and SVG defs are identical to upstream template.html.
 */
(function() {
  'use strict';

  var deckStage = document.getElementById('deck');
  var cardAlts = ['', 'alt', 'alt2'];
  var statAlts = ['', 'alt', 'alt2'];

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Header: top chrome
  function renderTop(slidePlan) {
    var pageType = slidePlan.page_type;
    var slots = slidePlan.slots || {};
    var label = pageTypeLabels[pageType] || pageType;
    return '<div class="top">'
      + '<span class="lockup"><img class="template-logo" src="assets/oralsage/logo.png" alt="OralSage"> ' + esc(label) + '</span>'
      + '<span class="meta"><span>OralSage</span><span>' + esc(slots.eyebrow || '') + '</span></span>'
      + '</div>';
  }

  // Footer
  function renderFooter(slidePlan, idx, total) {
    var slots = slidePlan.slots || {};
    var left = esc(slots.footer_left || 'OralSage');
    var right = esc(slots.footer_right || '');
    var page = String(idx + 1).padStart(2, '0');
    var totalStr = String(total).padStart(2, '0');
    return '<img class="template-robot" src="assets/oralsage/robot-2.png" alt="">'
      + '<div class="footer"><span>' + left + '</span><span>' + page + ' / ' + totalStr + '</span></div>';
  }

  var pageTypeLabels = {
    cover: '封面', agenda: '学习路径', notes: '要点卡片',
    notes_2up: '双知识点卡片', notes_4up: '四知识点卡片',
    section: '章节分隔', notice: '核心结论', chart: '数据图表',
    process: '流程步骤', matrix: '对比矩阵', stats: '数据总结',
    quote: '核心定义', cta: '行动步骤'
  };

  function renderCover(slots) {
    return '<section class="slide s-cover" data-label="封面">'
      + '<svg class="pin-1" viewBox="0 0 360 110"><use href="#pin"/></svg>'
      + '<svg class="pin-2" viewBox="0 0 360 130"><use href="#pin-open"/></svg>'
      + '<img class="cover-logo" src="assets/oralsage/logo.png" alt="OralSage">'
      + '<img class="cover-robot" src="assets/oralsage/robot-1.png" alt="">'
      + '<div class="stage">'
      + '<div class="super">' + esc(slots.eyebrow || '') + '</div>'
      + '<h1>' + esc(slots.title || '') + '</h1>'
      + '<div class="row">'
      + '<div class="who">' + esc(slots.presenter || '') + '<small>' + esc(slots.presenter_role || '') + '</small></div>'
      + '<div class="date">' + esc(slots.date_label || '') + '</div>'
      + '</div></div>'
      + '<div class="handwritten"><span class="underline">' + esc(slots.handwritten_note || '') + '</span></div>'
      + '</section>';
  }

  function renderAgenda(slots, idx, total) {
    var items = (slots.items || []).map(function(item) {
      return '<div class="row-item">'
        + '<span class="num">' + esc(item.num) + '</span>'
        + '<span class="lab">' + esc(item.label) + '</span>'
        + '<svg class="pin" viewBox="0 0 360 110"><use href="#pin"/></svg>'
        + '<span class="meta">' + esc(item.meta) + '</span>'
        + '</div>';
    }).join('');
    return '<section class="slide s-agenda" data-label="学习路径">'
      + renderTop({page_type:'agenda',slots:slots})
      + '<h2>' + esc(slots.headline || '') + '</h2>'
      + '<div class="list">' + items + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderNotes(slots, idx, total) {
    var cards = slots.cards || [];
    var gridClass = cards.length <= 2 ? 'grid cols2' : (cards.length >= 4 ? 'grid cols4' : 'grid');
    var cardsHtml = cards.map(function(card, i) {
      var alt = cardAlts[i % cardAlts.length];
      var pinType = i === 2 ? 'pin-open' : 'pin';
      return '<div class="card' + (alt ? ' ' + alt : '') + '">'
        + '<svg class="pin" viewBox="0 0 ' + (i === 2 ? '360 130' : '360 110') + '"><use href="#' + pinType + '"/></svg>'
        + '<span class="num">' + esc(card.label) + '</span>'
        + '<h3>' + esc(card.title) + '</h3>'
        + '<p>' + esc(card.body) + '</p>'
        + (card.scribble ? '<div class="scribble">' + esc(card.scribble) + '</div>' : '')
        + '</div>';
    }).join('');
    return '<section class="slide s-notes" data-label="要点卡片">'
      + renderTop({page_type:'notes',slots:slots})
      + '<div class="head"><h2>' + esc(slots.headline || '') + '</h2>'
      + '<div class="sub">' + esc(slots.subtitle || '') + '</div></div>'
      + '<div class="' + gridClass + '">' + cardsHtml + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  // Fixed 2-up notes variant: always 2 columns, more vertical space (grid notes-2up)
  function renderNotes2Up(slots, idx, total) {
    var cards = slots.cards || [];
    var cardsHtml = cards.map(function(card, i) {
      var alt = cardAlts[i % cardAlts.length];
      var pinType = i === 2 ? 'pin-open' : 'pin';
      return '<div class="card' + (alt ? ' ' + alt : '') + '">'
        + '<svg class="pin" viewBox="0 0 ' + (i === 2 ? '360 130' : '360 110') + '"><use href="#' + pinType + '"/></svg>'
        + '<span class="num">' + esc(card.label) + '</span>'
        + '<h3>' + esc(card.title) + '</h3>'
        + '<p>' + esc(card.body) + '</p>'
        + (card.scribble ? '<div class="scribble">' + esc(card.scribble) + '</div>' : '')
        + '</div>';
    }).join('');
    return '<section class="slide s-notes" data-label="双知识点卡片">'
      + renderTop({page_type:'notes_2up',slots:slots})
      + '<div class="head"><h2>' + esc(slots.headline || '') + '</h2>'
      + '<div class="sub">' + esc(slots.subtitle || '') + '</div></div>'
      + '<div class="grid notes-2up">' + cardsHtml + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  // Fixed 4-up notes variant: always 2x2 grid (grid notes-4up)
  function renderNotes4Up(slots, idx, total) {
    var cards = slots.cards || [];
    var cardsHtml = cards.map(function(card, i) {
      var alt = cardAlts[i % cardAlts.length];
      var pinType = i === 2 ? 'pin-open' : 'pin';
      return '<div class="card' + (alt ? ' ' + alt : '') + '">'
        + '<svg class="pin" viewBox="0 0 ' + (i === 2 ? '360 130' : '360 110') + '"><use href="#' + pinType + '"/></svg>'
        + '<span class="num">' + esc(card.label) + '</span>'
        + '<h3>' + esc(card.title) + '</h3>'
        + '<p>' + esc(card.body) + '</p>'
        + (card.scribble ? '<div class="scribble">' + esc(card.scribble) + '</div>' : '')
        + '</div>';
    }).join('');
    return '<section class="slide s-notes" data-label="四知识点卡片">'
      + renderTop({page_type:'notes_4up',slots:slots})
      + '<div class="head"><h2>' + esc(slots.headline || '') + '</h2>'
      + '<div class="sub">' + esc(slots.subtitle || '') + '</div></div>'
      + '<div class="grid notes-4up">' + cardsHtml + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderSection(slots, idx, total) {
    return '<section class="slide s-sec ink" data-label="章节分隔">'
      + '<div class="marker">' + esc(slots.marker || '') + '</div>'
      + '<div class="label">' + esc(slots.label || '') + '</div>'
      + '<svg class="pin-big" viewBox="0 0 360 110"><use href="#pin"/></svg>'
      + '<h2>' + esc(slots.headline || '') + '</h2>'
      + (slots.scribble ? '<div class="scribble">' + esc(slots.scribble) + '</div>' : '')
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderNotice(slots, idx, total) {
    var cols = slots.columns || [];
    var gridClass = cols.length === 2 ? 'grid cols2' : 'grid';
    var colsHtml = cols.map(function(col, i) {
      var bg = i === 1 ? ' b' : '';
      // Suppress meta when it duplicates the column title
      var metaHtml = '';
      if (col.meta && col.meta !== col.title) {
        metaHtml = '<div class="meta">' + esc(col.meta) + '</div>';
      }
      return '<div class="col' + bg + '">'
        + '<h3>' + esc(col.title) + '</h3>'
        + metaHtml
        + '<p>' + esc(col.body) + '</p>'
        + (col.source ? '<div class="src">' + esc(col.source) + '</div>' : '')
        + '</div>';
    }).join('');
    return '<section class="slide s-notice" data-label="核心结论">'
      + renderTop({page_type:'notice',slots:slots})
      + '<div class="head">'
      + '<div class="pre">' + esc(slots.eyebrow || '') + '</div>'
      + '<h2>' + esc(slots.headline || '') + '</h2>'
      + '</div>'
      + '<div class="' + gridClass + '">' + colsHtml + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderProcess(slots, idx, total) {
    var steps = slots.steps || [];
    var timeline = slots.timeline || [];
    var altClasses = ['', 'alt', 'alt2', 'alt', ''];
    var colsClass = 'cols' + Math.min(steps.length, 5);
    var stepsHtml = steps.map(function(step, i) {
      var alt = altClasses[i % altClasses.length];
      var pinType = i === 2 ? 'pin-open' : 'pin';
      return '<div class="node' + (alt ? ' ' + alt : '') + '">'
        + '<svg class="pin" viewBox="0 0 ' + (i === 2 ? '360 130' : '360 110') + '"><use href="#' + pinType + '"/></svg>'
        + '<div class="n">' + esc(step.num) + '</div>'
        + '<h3>' + esc(step.title) + '</h3>'
        + '<p>' + esc(step.body) + '</p>'
        + (i < steps.length - 1 ? '<svg class="arr" viewBox="0 0 32 32"><use href="#arr"/></svg>' : '')
        + '</div>';
    }).join('');
    var timelineHtml = timeline.length > 0
      ? '<div class="timeline">' + timeline.map(function(t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>'
      : '';
    return '<section class="slide s-process" data-label="流程步骤">'
      + renderTop({page_type:'process',slots:slots})
      + '<div class="head"><h2>' + esc(slots.headline || '') + '</h2>'
      + '<div class="sub">' + esc(slots.subtitle || '') + '</div></div>'
      + '<div class="flow ' + colsClass + '">' + stepsHtml + '</div>'
      + timelineHtml
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderMatrix(slots, idx, total) {
    var columns = slots.columns || [];
    var rows = slots.rows || [];
    var nCols = columns.length + 1; // +1 for row label column
    var tableStyle = 'grid-template-columns: 1.4fr ' + columns.map(function() { return '1fr'; }).join(' ') + ';';
    var headCells = '<div class="cell head-row"></div>'
      + columns.map(function(c) { return '<div class="cell head-row">' + esc(c) + '</div>'; }).join('');
    var rowCells = rows.map(function(row, ri) {
      var isLast = ri === rows.length - 1;
      var cells = row.cells || [];
      return '<div class="cell row-label' + (isLast ? ' last-row' : '') + '">' + esc(row.criterion) + '</div>'
        + cells.map(function(c, ci) {
          var lastCol = ci === cells.length - 1;
          return '<div class="cell' + (isLast ? ' last-row' : '') + '">'
            + '<span class="pill note">' + esc(c) + '</span></div>';
        }).join('');
    }).join('');
    return '<section class="slide s-matrix" data-label="对比矩阵">'
      + renderTop({page_type:'matrix',slots:slots})
      + '<div class="head"><h2>' + esc(slots.headline || '') + '</h2>'
      + '<div class="sub">' + esc(slots.subtitle || '') + '</div></div>'
      + '<div class="table" style="' + tableStyle + '">' + headCells + rowCells + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderStats(slots, idx, total) {
    var stats = slots.stats || [];
    var gridClass = stats.length <= 2 ? 'grid cols2' : 'grid';
    var statsHtml = stats.map(function(stat, i) {
      var alt = statAlts[i % statAlts.length];
      var pinType = i === 2 ? 'pin-open' : 'pin';
      return '<div class="stat' + (alt ? ' ' + alt : '') + '">'
        + '<svg class="pin" viewBox="0 0 ' + (i === 2 ? '360 130' : '360 110') + '"><use href="#' + pinType + '"/></svg>'
        + '<div class="big">' + esc(stat.value) + (stat.unit ? '<small>' + esc(stat.unit) + '</small>' : '') + '</div>'
        + '<h3>' + esc(stat.title) + '</h3>'
        + '<p>' + esc(stat.body) + '</p>'
        + '</div>';
    }).join('');
    return '<section class="slide s-stats" data-label="数据总结">'
      + renderTop({page_type:'stats',slots:slots})
      + '<div class="head"><h2>' + esc(slots.headline || '') + '</h2>'
      + '<div class="sub">' + esc(slots.subtitle || '') + '</div></div>'
      + '<div class="' + gridClass + '">' + statsHtml + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderQuote(slots, idx, total) {
    return '<section class="slide s-quote" data-label="核心定义">'
      + renderTop({page_type:'quote',slots:slots})
      + '<div class="panel">'
      + '<svg class="pin" viewBox="0 0 360 110"><use href="#pin"/></svg>'
      + '<div class="qmark">"</div>'
      + '<div>'
      + '<blockquote>' + esc(slots.quote_text || '') + '</blockquote>'
      + '<div class="who">' + esc(slots.attribution_name || '')
      + '<small>' + esc(slots.attribution_detail || '') + '</small></div>'
      + '</div></div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  function renderCta(slots, idx, total) {
    var steps = slots.steps || [];
    var stepsHtml = steps.map(function(step) {
      return '<div class="step">'
        + '<div class="n">' + esc(step.num) + '</div>'
        + '<div><h4>' + esc(step.title) + '</h4>'
        + '<p>' + esc(step.body) + '</p></div>'
        + '</div>';
    }).join('');
    return '<section class="slide s-cta" data-label="行动步骤">'
      + renderTop({page_type:'cta',slots:slots})
      + '<div class="stage">'
      + '<div class="pane l">'
      + '<div class="super">' + esc(slots.eyebrow || '') + '</div>'
      + '<h2>' + esc(slots.headline || '') + '</h2>'
      + '<p>' + esc(slots.body || '') + '</p>'
      + '<svg class="pin" viewBox="0 0 360 110"><use href="#pin"/></svg>'
      + '</div>'
      + '<div class="pane r"><h3>学习要点</h3>' + stepsHtml + '</div>'
      + '</div>'
      + renderFooter({slots:slots}, idx, total)
      + '</section>';
  }

  var renderers = {
    cover: renderCover,
    agenda: renderAgenda,
    notes: renderNotes,
    notes_2up: renderNotes2Up,
    notes_4up: renderNotes4Up,
    section: renderSection,
    notice: renderNotice,
    chart: function(slots, idx, total) {
      // Chart renders as a simplified placeholder
      return '<section class="slide s-chart ink" data-label="数据图表">'
        + renderTop({page_type:'chart',slots:slots})
        + '<svg class="pin-deco" viewBox="0 0 360 130"><use href="#pin-open"/></svg>'
        + '<div class="left">'
        + '<h2>' + esc(slots.headline || '') + '</h2>'
        + '<p>' + esc(slots.body || '') + '</p>'
        + '</div>'
        + '<div class="right"><div style="padding:40px;font-size:24px;opacity:.7;">图表区域（需数据输入）</div></div>'
        + renderFooter({slots:slots}, idx, total)
        + '</section>';
    },
    process: renderProcess,
    matrix: renderMatrix,
    stats: renderStats,
    quote: renderQuote,
    cta: renderCta
  };

  /**
   * Determine which fixture to load based on captured mode:
   *   __PIN_PAPER_MODE__ === 'production'  → production-pin-and-paper-plan.v1.json
   *   default                               → pin-and-paper-plan.v1.json (hand-crafted)
   *
   * The mode is captured in a script BEFORE deck-stage.js so that
   * deck-stage's history.replaceState('#1') doesn't overwrite #production.
   */
  function getFixturePath() {
    var mode = window.__PIN_PAPER_MODE__ || 'default';
    if (mode === 'real-production') {
      return 'fixtures/real-llm-production-plan.v1.json';
    }
    if (mode === 'real-generalized') {
      return 'fixtures/real-llm-generalized-plan.v1.json';
    }
    if (mode === 'production') {
      return 'fixtures/production-pin-and-paper-plan.v1.json';
    }
    if (mode === 'generalized') {
      return 'fixtures/production-generalized-plan.v1.json';
    }
    return 'fixtures/pin-and-paper-plan.v1.json';
  }

  function getFixtureLabel() {
    var mode = window.__PIN_PAPER_MODE__ || 'default';
    if (mode === 'real-production') {
      return '真实LLM生产版（牙周炎 handout → slides.v1 → real LLM plan）';
    }
    if (mode === 'real-generalized') {
      return '真实LLM泛化版（高血压 handout → slides.v1 → real LLM plan）';
    }
    if (mode === 'production') {
      return '生产形态 (handout → slides.v1 → Pin & Paper plan)';
    }
    if (mode === 'generalized') {
      return '泛化测试（高血压 handout → slides.v1 → Pin & Paper plan）';
    }
    return '手写 Fixture (pin-and-paper-plan.v1.json)';
  }

  function loadFixture() {
    var fixturePath = getFixturePath();
    var xhr = new XMLHttpRequest();
    xhr.open('GET', fixturePath, true);
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var deck = JSON.parse(xhr.responseText);
          renderDeck(deck);
        } catch (e) {
          showError('JSON 解析失败 (' + fixturePath + '): ' + e.message);
        }
      } else if (xhr.status === 404) {
        showError('Fixture 文件不存在: <code>' + fixturePath + '</code><br><br>'
          + '请先运行 <code>python scripts/smoke_test_pin_and_paper_planner.py</code> 生成生产形态 fixture。<br><br>'
          + '或去掉 URL 中的 #production 加载手写 fixture。<br><br>'
          + '启动方式: <code>python -m http.server 8766 -d tools/ppt_preview/templates/pin-and-paper</code>');
      } else {
        showError('无法加载 fixture 文件 (HTTP ' + xhr.status + '): <code>' + fixturePath + '</code>');
      }
    };
    xhr.onerror = function() {
      showError('无法加载 fixture 文件。请通过本地 HTTP server 打开此页面。<br><br>'
        + '启动方式: <code>python -m http.server 8766 -d tools/ppt_preview/templates/pin-and-paper</code><br><br>'
        + '切换 fixture:<br>'
        + '  手写版: <a href="#" style="color:var(--ink)">preview.html</a><br>'
        + '  生产版: <a href="#production" style="color:var(--ink)">preview.html#production</a>');
    };
    xhr.send();
  }

  function renderDeck(deck) {
    while (deckStage.firstChild) { deckStage.removeChild(deckStage.firstChild); }

    var slides = deck.slides || [];
    var total = slides.length;

    if (total === 0) {
      showError('Fixture 中没有幻灯片数据。');
      return;
    }

    // ---- Runtime source traceability -----------------------------------
    // Expose which fixture was loaded so tests can verify the data source
    // without relying on screenshot heuristics.
    var fixturePath = getFixturePath();
    var fixtureLabel = getFixtureLabel();
    var mode = window.__PIN_PAPER_MODE__ || 'default';

    deckStage.setAttribute('data-fixture-source', fixturePath);
    deckStage.setAttribute('data-fixture-label', fixtureLabel);
    deckStage.setAttribute('data-pin-paper-mode', mode);

    // Hidden debug element for test scraping
    var debugEl = document.createElement('div');
    debugEl.id = 'pin-paper-fixture-debug';
    debugEl.setAttribute('data-fixture-source', fixturePath);
    debugEl.setAttribute('data-fixture-label', fixtureLabel);
    debugEl.style.cssText = 'display:none;';
    debugEl.textContent = 'source:' + fixturePath + '|label:' + fixtureLabel;
    document.body.appendChild(debugEl);
    // --------------------------------------------------------------------

    // Visual indicator: mode badge
    var modeLabels = {
      'real-production': 'MODE: REAL-LLM PRODUCTION',
      'real-generalized': 'MODE: REAL-LLM GENERALIZED',
      production: 'MODE: PRODUCTION',
      generalized: 'MODE: GENERALIZED',
    };
    var modeLabel = modeLabels[mode];
    if (modeLabel) {
      var badge = document.createElement('div');
      badge.id = 'pin-paper-mode-badge';
      badge.style.cssText = 'position:fixed;top:10px;right:16px;z-index:99999;'
        + 'background:var(--ink);color:var(--paper);padding:4px 14px;border-radius:4px;'
        + 'font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.1em;'
        + 'pointer-events:none;opacity:.85;';
      badge.textContent = modeLabel;
      document.body.appendChild(badge);
    }

    slides.forEach(function(slidePlan, i) {
      var renderer = renderers[slidePlan.page_type];
      if (!renderer) {
        console.warn('Unknown page_type: ' + slidePlan.page_type);
        return;
      }
      var html = renderer(slidePlan.slots, i, total);
      var temp = document.createElement('div');
      temp.innerHTML = html;
      var slideEl = temp.firstElementChild;
      if (slideEl) {
        slideEl.setAttribute('data-label', pageTypeLabels[slidePlan.page_type] || slidePlan.page_type);
        deckStage.appendChild(slideEl);
      }
    });

    console.log('Pin & Paper preview loaded: ' + total + ' slides');
    console.log('  Fixture path: ' + fixturePath);
    console.log('  Fixture label: ' + fixtureLabel);
    console.log('  Mode: ' + mode);
    console.log('  Deck title: ' + (deck.deck_title || '(untitled)'));
    console.log('  deck-stage data-fixture-source: ' + deckStage.getAttribute('data-fixture-source'));
  }

  function showError(msg) {
    while (deckStage.firstChild) { deckStage.removeChild(deckStage.firstChild); }
    var errorSlide = document.createElement('section');
    errorSlide.className = 'slide';
    errorSlide.setAttribute('data-label', 'Error');
    var div = document.createElement('div');
    div.style.cssText = 'position:absolute;left:80px;right:80px;top:50%;transform:translateY(-50%);'
      + 'font-family:"Space Grotesk",sans-serif;font-size:28px;color:var(--ink);text-align:center;line-height:1.6;';
    div.innerHTML = msg;
    errorSlide.appendChild(div);
    deckStage.appendChild(errorSlide);
  }

  loadFixture();
})();
</script>

</body>
</html>
