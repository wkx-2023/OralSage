<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库查看 - OralSage</title>
  <link rel="icon" href="/assets/images/oralsage-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css?v=20260502-brand">
  <link rel="stylesheet" href="/css/evidence-page.css?v=20260502f">
</head>
<body class="knowledge-page">
  <div class="app-shell">
    <aside class="rail">
      <nav id="module-nav" class="module-nav"></nav>
    </aside>

    <section class="main-pane">
      <header class="topbar">
        <div>
          <h1 id="page-title" class="page-title"></h1>
          <p id="page-subtitle" class="page-subtitle"></p>
        </div>
        
      </header>

      <main class="workspace evidence-workspace">
        <section class="knowledge-toolbar">
          <div class="knowledge-title-block">
            <h2>口腔问题知识查看</h2>
          </div>
          <div class="knowledge-controls">
            <select id="knowledge-dimension" class="knowledge-select">
              <option value="all">全部知识维度</option>
            </select>
            <select id="knowledge-source" class="knowledge-select">
              <option value="all">全部来源</option>
            </select>
          </div>
        </section>

        <section class="knowledge-layout">
          <aside class="topic-panel">
            <div class="panel-head">
              <h3>口腔问题</h3>
              <span id="topic-count">0 类</span>
            </div>
            <div id="topic-list" class="topic-list"></div>
          </aside>

          <section class="knowledge-center">
            <div class="path-strip" aria-label="临床路径视图">
              <button type="button" class="path-step active" data-dimension="clinical_feature">识别问题</button>
              <button type="button" class="path-step" data-dimension="exam">关键检查</button>
              <button type="button" class="path-step" data-dimension="diagnosis">诊断判断</button>
              <button type="button" class="path-step" data-dimension="differential">鉴别风险</button>
              <button type="button" class="path-step" data-dimension="treatment">治疗原则</button>
              <button type="button" class="path-step" data-dimension="education">随访宣教</button>
            </div>

            <div class="topic-summary">
              <div>
                <p class="eyebrow">当前主题</p>
                <h2 id="active-topic-name">加载中...</h2>
              </div>
              <div id="knowledge-count" class="knowledge-count">正在读取知识库</div>
            </div>

            <div id="knowledge-groups" class="knowledge-groups"></div>
          </section>

          <aside class="evidence-detail">
            <div class="panel-head">
              <h3>依据详情</h3>
              <button id="copy-evidence" type="button" class="btn ghost mini-btn">复制</button>
            </div>
            <div id="evidence-detail-body" class="detail-body empty">
              选择一个知识点后，这里会显示原文摘录、来源类型、页码和相关性说明。
            </div>
          </aside>
        </section>
      </main>
    </section>
  </div>

  <script src="/js/common.js?v=20260702-learning-shell"></script>
  <script src="/js/evidence.js?v=20260502f"></script>
</body>
</html>
