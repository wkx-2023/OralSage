<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能问答 - OralSage</title>
  <link rel="icon" href="/assets/images/oralsage-logo.jpg">
  <link rel="preload" href="/assets/fonts/rajdhani-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css?v=20260716-brand-font-stable">
  <link rel="stylesheet" href="/css/master-chat.css?v=20260730-nav-unified-v4">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="chat-product-page">
  <div class="app-shell chat-product-shell">
    <aside class="rail chat-history-panel">
      <div class="history-head">
        <button type="button" id="new-session" class="history-new">
          <i data-lucide="plus"></i><span>新建对话</span>
        </button>
      </div>
      <div id="history-list" class="history-list"></div>
    </aside>

    <main class="main-pane chat-main-area">
      <header class="topbar">
        <div>
          <h1 id="page-title" class="page-title"></h1>
          <p id="page-subtitle" class="page-subtitle"></p>
        </div>
      </header>

      <section class="chat-stage">
        <aside id="avatar-presenter" class="avatar-presenter" aria-label="OralSage 数字人桌宠">
          <div class="avatar-presenter-head">
            <div>
              <span>数字人讲解</span>
              <strong id="avatar-presenter-name">凌小柒</strong>
            </div>
            <span id="avatar-presenter-status" class="avatar-presenter-status">正在连接</span>
          </div>
          <div id="avatar-presenter-stage" class="avatar-presenter-stage" aria-live="polite">
            <div class="avatar-presenter-fallback">
              <i data-lucide="loader-circle" aria-label="数字人正在连接"></i>
            </div>
          </div>
          <i class="avatar-pet-grip" data-lucide="grip-vertical" aria-hidden="true"></i>
          <div id="avatar-pet-actions" class="avatar-pet-actions" role="group" aria-label="数字人互动动作" hidden>
            <button type="button" class="avatar-pet-action" data-avatar-action="greet" title="打招呼" aria-label="打招呼"><i data-lucide="hand"></i></button>
            <button type="button" class="avatar-pet-action" data-avatar-action="think" title="思考" aria-label="思考"><i data-lucide="lightbulb"></i></button>
            <button type="button" class="avatar-pet-action" data-avatar-action="cheer" title="鼓励" aria-label="鼓励"><i data-lucide="sparkles"></i></button>
          </div>
        </aside>
        <div id="chat-welcome" class="chat-welcome">
          <div class="welcome-mark"><i data-lucide="sparkles"></i></div>
          <div class="welcome-title">从一个口腔医学问题开始</div>
          <div class="welcome-chips">
            <button type="button" class="chip" data-prompt="系统讲解牙周炎，并生成讲稿和PPT">牙周炎课程</button>
            <button type="button" class="chip" data-prompt="推荐今天的口腔医学学习任务">今日计划</button>
            <button type="button" class="chip" data-prompt="检索近两年口腔扁平苔藓的研究进展">前沿文献</button>
          </div>
        </div>

        <div class="chat-thread-shell">
          <div id="agent-chat-log" class="chat-thread" aria-live="polite"></div>
        </div>

        <div class="chat-composer-shell">
          <div class="chat-composer-card">
            <div class="composer-input-wrap">
              <textarea id="agent-message" rows="1" placeholder="&#36755;&#20837;&#20320;&#30340;&#38382;&#39064;&#65292;Enter &#21457;&#36865;&#65292;Shift + Enter &#25442;&#34892;"></textarea>
            </div>
            <div class="composer-footer">
              <div class="composer-hint"></div>
              <div class="composer-actions">
                <button id="agent-clear" class="icon-command" type="button" title="清空当前对话" aria-label="清空当前对话">
                  <i data-lucide="trash-2"></i>
                </button>
                <button id="agent-send" class="send-command" type="button">
                  <span>发送</span><i data-lucide="arrow-up"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js?v=20260730-nav-v3"></script>
  <script src="/js/master-chat.js?v=20260730-avatar-pet-v2"></script>
</body>
</html>
