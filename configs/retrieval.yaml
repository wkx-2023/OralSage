retrieval:
  backend: local
  use_nexent: false
  chunk_store: data/kb/kag_bge_m3
  vector_index: data/kb/kag_bge_m3/indexes/dense_bge_m3
  sparse_index: data/kb/kag_bge_m3/indexes/sparse

embedding:
  model_name: BAAI/bge-m3
  local_path: models/embeddings/bge-m3
  normalize: true
  fallback: stable_hashing

chunking:
  target_chars: 900
  overlap_chars: 120
  preserve_headings: true
  min_chars: 120

sources:
  - name: oral_edu_kag_bge_m3
    path: data/kb/kag_bge_m3/retrieval_corpus.jsonl
    source_type: reference

ranking:
  top_k_dense: 20
  top_k_sparse: 20
  final_top_k: 8
  reranker: optional
  source_weights:
    guideline: 1.35
    clinical_norm: 1.35
    textbook: 1.18
    clinical_case: 1.05
    general_reference: 0.92

metadata:
  content_type_labels:
    - definition
    - etiology
    - pathogenesis
    - pathology
    - clinical_feature
    - diagnosis
    - differential
    - treatment
    - prognosis
    - risk
    - contraindication
