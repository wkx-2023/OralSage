<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能问答 - OralSage</title>
  <link rel="icon" href="/assets/images/oralsage-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css?v=20260502-history2">
  <link rel="stylesheet" href="/css/master-chat.css?v=20260702-learning-shell">
</head>
<body class="chat-product-page">
  <div class="app-shell chat-product-shell">
    <aside class="rail chat-history-panel">
      <div class="history-head">
        <button type="button" id="new-session" class="history-new">+ &#26032;&#24314;&#23545;&#35805;</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </aside>

    <main class="main-pane chat-main-area">
      <header class="topbar chat-topbar">
        <div>
          <h1 id="page-title" class="page-title"></h1>
          <p id="page-subtitle" class="page-subtitle"></p>
        </div>
        
      </header>

      <section class="chat-stage">
        <div id="chat-welcome" class="chat-welcome">
          <div class="welcome-mark">&#9671;</div>
          <div class="welcome-title">新的学习型智能问答正在重建</div>
          <div class="welcome-copy">旧总控 agent 已从前端调用链中摘除。这里会成为后续学习总控与学习 agent 的对话入口；现阶段请从总控工作台的工具箱打开独立工具。</div>
          <div class="welcome-chips">
            <button type="button" class="chip" data-prompt="如何学习阻生齿相关知识？">学习路径</button>
            <button type="button" class="chip" data-prompt="帮我建立牙髓炎复习计划">复习计划</button>
            <button type="button" class="chip" data-prompt="根据知识图谱讲解根尖周炎">图谱讲解</button>
            <button type="button" class="chip" data-prompt="推荐今天的口腔医学学习任务">今日任务</button>
          </div>
        </div>

        <div class="chat-thread-shell">
          <div id="agent-chat-log" class="chat-thread" aria-live="polite"></div>
        </div>

        <div class="chat-composer-shell">
          <div class="chat-composer-card">
            <div class="composer-input-wrap">
              <textarea id="agent-message" rows="1" placeholder="&#36755;&#20837;&#20320;&#30340;&#38382;&#39064;&#65292;Enter &#21457;&#36865;&#65292;Shift + Enter &#25442;&#34892;"></textarea>
            </div>
            <div class="composer-footer">
              <div class="composer-hint"></div>
              <div class="composer-actions">
                <button id="agent-clear" class="btn ghost" type="button">&#28165;&#31354;&#24403;&#21069;</button>
                <button id="agent-send" class="btn strong" type="button">&#21457;&#36865;</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js?v=20260702-learning-shell"></script>
  <script src="/js/master-chat.js?v=20260702-learning-shell"></script>
</body>
</html>
